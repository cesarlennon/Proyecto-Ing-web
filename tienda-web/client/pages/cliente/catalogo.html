<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | TiendaWeb</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <a class="logo" href="/pages/cliente/inicio.html">TiendaWeb</a>
    <nav class="menu" aria-label="Menú principal">
      <a class="activo" href="/pages/cliente/catalogo.html">Catálogo</a>
      <a href="/pages/cliente/carrito.html">Carrito<span id="contador-carrito"></span></a>
      <a href="/pages/cliente/pedidos.html">Mis pedidos</a>
      <a href="/pages/cliente/cuenta.html">Mi cuenta</a>
    </nav>
    <div class="acciones">
      <span class="usuario-sesion" id="nombre-usuario"></span>
      <button type="button" class="boton boton-secundario" id="btn-salir">Salir</button>
    </div>
  </header>
  <div class="layout-catalogo">
    <aside class="filtro-categorias" aria-label="Filtro por categoría">
      <h2>Categorías</h2>
      <div id="lista-categorias"></div>
    </aside>
    <main class="catalogo">
      <h1>Catálogo de productos</h1>
      <p id="mensaje" class="mensaje oculto" role="alert"></p>
      <div id="grid" class="grid-productos"></div>
      <p id="sin-resultados" class="sin-resultados oculto">No hay productos en esta categoría por ahora.</p>
      <div id="paginacion" class="paginacion"></div>
    </main>
  </div>
  <footer class="pie">
    © 2026 TiendaWeb · <a href="/aviso-privacidad.html">Aviso de privacidad</a>
  </footer>

  <script src="/js/dom.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/sesion.js"></script>
  <script src="/js/carrito-contador.js"></script>
  <script src="/js/catalogo.js"></script>
</body>
</html>
