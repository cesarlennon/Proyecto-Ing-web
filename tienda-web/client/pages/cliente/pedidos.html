<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis pedidos | TiendaWeb</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <a class="logo" href="/pages/cliente/inicio.html">TiendaWeb</a>
    <nav class="menu" aria-label="Menú principal">
      <a href="/pages/cliente/catalogo.html">Catálogo</a>
      <a href="/pages/cliente/carrito.html">Carrito<span id="contador-carrito"></span></a>
      <a class="activo" href="/pages/cliente/pedidos.html">Mis pedidos</a>
      <a href="/pages/cliente/cuenta.html">Mi cuenta</a>
    </nav>
    <div class="acciones">
      <span class="usuario-sesion" id="nombre-usuario"></span>
      <button type="button" class="boton boton-secundario" id="btn-salir">Salir</button>
    </div>
  </header>
  <main class="contenido" style="max-width:900px;margin:0 auto;">
    <h1>Mis pedidos</h1>
    <p id="mensaje" class="mensaje oculto" role="alert"></p>
    <div class="tabla-contenedor">
      <table class="tabla">
        <thead><tr><th>No. de pedido</th><th>Fecha</th><th>Total</th><th>Estatus</th><th></th></tr></thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </div>
    <p id="sin-resultados" class="sin-resultados oculto">Aún no tienes pedidos.</p>

    <section id="detalle" class="oculto" style="border:1px solid #9db3d6;border-radius:6px;padding:1.25rem;margin-top:1.25rem;background:#f7faff;">
      <h2 id="detalle-titulo" style="color:var(--azul-oscuro);margin-top:0;"></h2>
      <div id="detalle-pasos" class="filtros" style="gap:0.25rem;"></div>
      <div id="detalle-productos"></div>
      <p id="detalle-direccion"></p>
      <p id="detalle-pago"></p>
      <p class="nota">Calificar y recomendar solo se habilita cuando el pedido está en estatus «Recibido».</p>
    </section>
  </main>
  <footer class="pie">
    © 2026 TiendaWeb · <a href="/aviso-privacidad.html">Aviso de privacidad</a>
  </footer>

  <script src="/js/dom.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/sesion.js"></script>
  <script src="/js/carrito-contador.js"></script>
  <script src="/js/pedidos.js"></script>
</body>
</html>
