<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario | TiendaWeb</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <a class="logo" href="/pages/inventarios/inicio.html">TiendaWeb · Inventarios</a>
    <nav class="menu" aria-label="Menú principal">
      <a class="activo" href="/pages/inventarios/inventario.html">Inventario</a>
    </nav>
    <div class="acciones">
      <span class="usuario-sesion" id="nombre-usuario"></span>
      <button type="button" class="boton boton-secundario" id="btn-salir">Salir</button>
    </div>
  </header>
  <main class="contenido">
    <h1>Inventario</h1>
    <p id="mensaje" class="mensaje oculto" role="alert"></p>

    <form id="form-filtros" class="filtros" novalidate>
      <input type="search" id="busqueda" placeholder="Buscar producto por nombre o ID" aria-label="Buscar producto" maxlength="100">
      <button type="submit" class="boton boton-primario">Buscar</button>
    </form>

    <div class="tabla-contenedor">
      <table class="tabla">
        <thead><tr><th>ID</th><th>Producto</th><th>Precio</th><th>Stock</th><th>Imágenes</th><th>Acciones</th></tr></thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </div>
    <p id="sin-resultados" class="sin-resultados oculto">No se encontraron productos.</p>
    <div id="paginacion" class="paginacion"></div>
    <p class="nota">Al guardar un cambio se pide confirmación y queda registrado en la bitácora.</p>
  </main>
  <footer class="pie">
    © 2026 TiendaWeb · <a href="/aviso-privacidad.html">Aviso de privacidad</a>
  </footer>

  <script src="/js/validaciones.js"></script>
  <script src="/js/dom.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/sesion.js"></script>
  <script src="/js/tabla-productos.js"></script>
  <script src="/js/inventario.js"></script>
</body>
</html>
